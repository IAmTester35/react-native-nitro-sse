name: Continuous Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    branches: [main, beta]
    types:
      - completed

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version changed
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"

          # Check if this specific version is already published
          PUBLISHED_VERSION=$(npm view "$NAME@$VERSION" version 2>/dev/null || echo "")

          # Check if GitHub release already exists
          RELEASE_EXISTS=false
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
          fi

          NPM_PUBLISHED=false
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            NPM_PUBLISHED=true
          fi

          if [ "$NPM_PUBLISHED" = "true" ] && [ "$RELEASE_EXISTS" = "true" ]; then
            echo "Version $VERSION is already published on npm and GitHub Release exists. Skipping."
            echo "npm_publish=false" >> $GITHUB_OUTPUT
            echo "gh_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Enforce branch release policies
          if [[ "$BRANCH" != "main" ]] && [[ "$VERSION" != *"beta"* ]] && [[ "$VERSION" != *"alpha"* ]]; then
            echo "::error::Stable version $VERSION cannot be published from branch '$BRANCH'. Stable releases must be merged to and published from 'main'."
            exit 1
          fi

          if [[ "$BRANCH" != "beta" ]] && ([[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"alpha"* ]]); then
            echo "::error::Pre-release version $VERSION cannot be published from branch '$BRANCH'. Pre-releases must be published from 'beta'."
            exit 1
          fi

          if [ "$NPM_PUBLISHED" = "false" ]; then
            echo "npm_publish=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION already published on npm. Skipping npm publish."
            echo "npm_publish=false" >> $GITHUB_OUTPUT
          fi

          if [ "$RELEASE_EXISTS" = "false" ]; then
            echo "gh_release=true" >> $GITHUB_OUTPUT
          else
            echo "GitHub Release v$VERSION already exists. Skipping release creation."
            echo "gh_release=false" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build package
        if: steps.check.outputs.npm_publish == 'true'
        run: yarn prepare

      - name: Extract Release Notes
        if: steps.check.outputs.gh_release == 'true'
        id: extract_changelog
        run: awk '/^## / {if (p) exit; p=1; next} p' CHANGELOG.md > RELEASE_NOTES.md
        shell: bash

      - name: Upgrade npm CLI for Trusted Publishing
        if: steps.check.outputs.npm_publish == 'true'
        run: npm install -g npm@11

      - name: Publish to npm
        if: steps.check.outputs.npm_publish == 'true'
        run: |
          if [[ "${{ steps.check.outputs.version }}" == *"beta"* ]]; then
            npm publish --access public --tag beta --provenance
          elif [[ "${{ steps.check.outputs.version }}" == *"alpha"* ]]; then
            npm publish --access public --tag alpha --provenance
          else
            npm publish --access public --provenance
          fi
        shell: bash

      - name: Create GitHub Release
        if: steps.check.outputs.gh_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: Release v${{ steps.check.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: ${{ !contains(steps.check.outputs.version, 'beta') && !contains(steps.check.outputs.version, 'alpha') }}
          draft: false
          prerelease: ${{ contains(steps.check.outputs.version, 'beta') || contains(steps.check.outputs.version, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
