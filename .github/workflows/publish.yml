name: Continuous Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version changed
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          
          # Check if this specific version is already published
          PUBLISHED_VERSION=$(npm view "$NAME@$VERSION" version 2>/dev/null || echo "")
          
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "Version $VERSION is already published on npm. Skipping."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on npm. Proceeding to publish."
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Build package
        if: steps.check.outputs.changed == 'true'
        run: yarn prepare

      - name: Extract Release Notes
        if: steps.check.outputs.changed == 'true'
        id: extract_changelog
        run: awk '/^## / {if (p) exit; p=1; next} p' CHANGELOG.md > RELEASE_NOTES.md
        shell: bash

      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: Release v${{ steps.check.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: ${{ contains(steps.check.outputs.version, 'beta') || contains(steps.check.outputs.version, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade npm CLI for Trusted Publishing
        if: steps.check.outputs.changed == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.changed == 'true'
        run: |
          if [[ "${{ steps.check.outputs.version }}" == *"beta"* ]]; then
            npm publish --access public --tag beta --provenance --loglevel verbose
          elif [[ "${{ steps.check.outputs.version }}" == *"alpha"* ]]; then
            npm publish --access public --tag alpha --provenance --loglevel verbose
          else
            npm publish --access public --provenance --loglevel verbose
          fi
        shell: bash
